<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo | Devioz</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="admin-login-wrapper">
        <div class="glass-card p-4 p-md-5" style="width: 100%; max-width: 420px;">
            <!-- Encabezado con logo Devioz -->
            <div class="text-center mb-4">
                <a href="index.html" class="text-white text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
                    <img src="assets/img/devioz-img.png" alt="Devioz Logo" class="brand-logo-img" style="height: 42px;">
                    <span class="fs-2 fw-bold" style="letter-spacing: -0.02em;">Devioz</span>
                </a>
                <div class="mb-2">
                    <span class="badge" style="background: rgba(0, 180, 167, 0.18); color: #5eead4; border: 1px solid rgba(0, 180, 167, 0.35); font-weight: 500; font-size: 0.76rem; padding: 4px 10px; border-radius: 20px;">
                        Panel de Administración
                    </span>
                </div>
                <p class="small mb-0" style="color: #94a3b8;">Ingresa tus credenciales para gestionar el portafolio</p>
            </div>

            <!-- Formulario de Acceso -->
            <form id="loginForm" autocomplete="on">
                <div id="loginAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; border-radius: 10px;"></div>

                <div class="mb-3">
                    <label for="username" class="form-label-custom">Usuario</label>
                    <input type="text" class="form-control form-control-glass" id="username" name="username" placeholder="Ingresa tu usuario" required autocomplete="username">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label-custom">Contraseña</label>
                    <input type="password" class="form-control form-control-glass" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-main w-100 py-2 mb-3" id="btnLoginSubmit">
                    Ingresar
                </button>

                <div class="text-center">
                    <a href="index.html" class="text-secondary small text-decoration-none hover-white" style="color: #94a3b8 !important; transition: color 0.2s;">
                        ← Volver al inicio
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Custom Admin JS -->
    <script src="assets/js/admin.js"></script>
</body>
</html>
